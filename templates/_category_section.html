<section class="card card-secondary" id="category-section">
    <div class="section-head">
        <h2>分类区</h2>
        <span class="state-pill">按商户分组批量确认</span>
    </div>
    <form class="search-form"
          hx-get="/inbox/category" hx-target="#category-table-area" hx-swap="outerHTML"
          hx-trigger="input changed delay:300ms, search">
        <input type="search" name="q" value="{{ cat_q }}" placeholder="搜索商户名，如 美团">
        {% if cat_q %}
        <button type="button" class="quiet"
                hx-get="/inbox/category?page=1" hx-target="#category-table-area" hx-swap="outerHTML">清除</button>
        {% endif %}
    </form>
    {% include "_category_table.html" %}
</section>
