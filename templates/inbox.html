{% extends "base.html" %}
{% block title %}待确认 · 本地账本{% endblock %}
{% block page_title %}待确认{% endblock %}
{% block content %}
<datalist id="cat-options">
    {% for cat in categories %}<option value="{{ cat }}"></option>{% endfor %}
</datalist>
{% include "_high_risk_section.html" %}
{% include "_category_section.html" %}
<script>
(function () {
    function syncBulkCategory(form) {
        var typeControl = form.querySelector('[name="entry_type"]');
        var catSelect = form.querySelector('select[name="category"]');
        if (!typeControl || !catSelect) return;

        var entryType = typeControl.value;
        catSelect.querySelectorAll('optgroup[data-for-type]').forEach(function (group) {
            var visible = group.dataset.forType === entryType;
            group.disabled = !visible;
            group.hidden = !visible;
        });

        catSelect.required = true;
        var allowed = Array.prototype.slice.call(
            catSelect.querySelectorAll('optgroup[data-for-type="' + entryType + '"] option')
        ).map(function (option) { return option.value; });
        if (allowed.length && allowed.indexOf(catSelect.value) === -1) {
            catSelect.value = allowed[0];
        }
        if (!allowed.length) {
            catSelect.value = '';
            catSelect.required = false;
        }
    }

    function initCategoryForms(root) {
        var forms = (root || document).querySelectorAll('.bulk-confirm-form, .single-confirm-form');
        forms.forEach(function (form) {
            syncBulkCategory(form);
        });
    }

    document.addEventListener('DOMContentLoaded', function () { initCategoryForms(document); });
    document.addEventListener('change', function (event) {
        if (event.target && event.target.matches('.bulk-confirm-form select[name="entry_type"], .single-confirm-form select[name="entry_type"]')) {
            syncBulkCategory(event.target.closest('form'));
        }
    });
    document.body.addEventListener('htmx:afterSwap', function (event) {
        var root = (event.detail && event.detail.elt) || document;
        initCategoryForms(root);
    });

    var pendingScrollAnchor = null;
    document.body.addEventListener('htmx:beforeSwap', function (event) {
        var target = event.detail && event.detail.target;
        if (!target || !target.id) return;
        if (target.id !== 'category-table-area' && target.id !== 'high-risk-section' && target.id.indexOf('risk-') !== 0) {
            return;
        }
        var rect = target.getBoundingClientRect();
        pendingScrollAnchor = {
            targetId: target.id,
            targetTop: rect.top,
            scrollY: window.scrollY
        };
    });
    document.body.addEventListener('htmx:afterSwap', function (event) {
        if (!pendingScrollAnchor) return;
        var current = document.getElementById(pendingScrollAnchor.targetId);
        if (current) {
            var rect = current.getBoundingClientRect();
            var delta = rect.top - pendingScrollAnchor.targetTop;
            window.scrollTo(0, pendingScrollAnchor.scrollY + delta);
        }
        pendingScrollAnchor = null;
    });
})();
</script>
{% endblock %}
